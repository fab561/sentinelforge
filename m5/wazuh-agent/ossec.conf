<!--
  Wazuh Agent Configuration — SentinelForge M5 (Honeypot)
  Agent name: honeypot-cowrie
  Reads: Cowrie JSON logs from shared volume
  Ships to: wazuh-manager:1514 (TCP)
-->
<ossec_config>

  <!-- ── Server Connection ──────────────────────────────────── -->
  <client>
    <server>
      <address>wazuh-manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>

    <!-- Auto-enrollment: register agent with manager on first start -->
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh-manager</manager_address>
      <port>1515</port>
      <agent_name>honeypot-cowrie</agent_name>
      <!-- No password required (manager accepts all in dev mode) -->
    </enrollment>

    <crypto_method>aes</crypto_method>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ── Cowrie JSON Log Ingestion ──────────────────────────── -->
  <localfile>
    <!-- Cowrie outputs JSON-lines format — one event per line -->
    <log_format>json</log_format>
    <location>/var/log/cowrie/cowrie.json</location>
  </localfile>

  <!-- ── System Log Collection (basic) ─────────────────────── -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- ── Agent Logging ──────────────────────────────────────── -->
  <logging>
    <log_level>1</log_level>
  </logging>

</ossec_config>
