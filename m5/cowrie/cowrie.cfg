# Cowrie SSH Honeypot — SentinelForge M5 Configuration
# Docs: https://cowrie.readthedocs.io/en/latest/

[honeypot]
# Fake hostname shown to attackers
hostname = prod-server-01

# Listen on 2222 inside container (mapped to 22 on host)
listen_endpoints = tcp:2222:interface=0.0.0.0

# Fake filesystem — makes attacker think it's a real Linux box
filesystem = ${COWRIE_DIR}/share/cowrie/fs.pickle

# Data directory
data_path = ${COWRIE_DIR}/var/lib/cowrie

# Log directory
log_path = ${COWRIE_DIR}/var/log/cowrie

# Fake system info shown to attackers
kernel_version = 5.15.0-1-arm64
kernel_build_string = #1 SMP Debian 5.15.5-2 (2021-12-18)
hardware_platform = aarch64
operating_system = GNU/Linux

# SSH version banner — looks like a real Debian server
ssh_version = SSH-2.0-OpenSSH_8.4p1 Debian-5+deb11u1

# Simulate a slow, real server (adds realism)
interactive_timeout = 120
authentication_timeout = 120

# Limit attacker session duration (seconds)
# Prevents resource exhaustion
interactive_timeout = 120

# Allow max N login attempts before disconnect
auth_attempts = 5

[output_textlog]
enabled = false

[output_jsonlog]
# JSON log — this is what Wazuh agent reads
enabled = true
logfile = cowrie.json

[output_mysql]
enabled = false

[output_elasticsearch]
enabled = false
