version: '3.8'

services:
  # ─── Wazuh Indexer (OpenSearch) ─────────────────────────────────
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.4
    container_name: sf-wazuh-indexer
    hostname: wazuh-indexer
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
      discovery.type: single-node
      plugins.security.ssl.http.enabled: "false"
      plugins.security.disabled: "true"
      compatibility.override_main_response_version: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/indexer/opensearch.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
    networks:
      - sentinelforge

  # ─── Wazuh Manager ─────────────────────────────────────────────
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.4
    container_name: sf-wazuh-manager
    hostname: wazuh-manager
    restart: unless-stopped
    ports:
      - "1514:1514"       # Agent communication
      - "1515:1515"       # Agent enrollment
      - "514:514/udp"     # Syslog
      - "55000:55000"     # Wazuh REST API
    environment:
      INDEXER_URL: http://wazuh-indexer:9200
      INDEXER_USERNAME: ""
      INDEXER_PASSWORD: ""
      FILEBEAT_SSL_VERIFICATION_MODE: none
      SSL_CERTIFICATE_AUTHORITIES: ""
      SSL_CERTIFICATE: ""
      SSL_KEY: ""
      API_USERNAME: ${WAZUH_API_USER:-wazuh-wui}
      API_PASSWORD: ${WAZUH_API_PASSWORD:-MyS3cr3tP4ssw0rd!}
    volumes:
      - wazuh-api-config:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - filebeat-etc:/etc/filebeat
      - filebeat-var:/var/lib/filebeat
      - ./wazuh/custom_rules/sentinelforge_rules.xml:/var/ossec/etc/rules/sentinelforge_rules.xml:ro
    depends_on:
      - wazuh-indexer
    networks:
      - sentinelforge

  # ─── Wazuh Dashboard ───────────────────────────────────────────
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.4
    container_name: sf-wazuh-dashboard
    hostname: wazuh-dashboard
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      WAZUH_API_URL: https://wazuh-manager
      API_USERNAME: ${WAZUH_API_USER:-wazuh-wui}
      API_PASSWORD: ${WAZUH_API_PASSWORD:-MyS3cr3tP4ssw0rd!}
      SERVER_SSL_ENABLED: "false"
      OPENSEARCH_HOSTS: '["http://wazuh-indexer:9200"]'
    # Security plugin depends on indexer's security API which is disabled.
    # Strip the dashboard-side plugin at startup so no login is required.
    entrypoint: ["/bin/bash", "-c", "rm -rf /usr/share/wazuh-dashboard/plugins/securityDashboards && exec /entrypoint.sh"]
    volumes:
      - ./wazuh/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    networks:
      - sentinelforge

  # ─── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sf-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelforge}
      POSTGRES_USER: ${POSTGRES_USER:-sf_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sentinelforge

  # ─── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sentinelforge

  # ─── Backend (FastAPI) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sf-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sf_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-sentinelforge}
      REDIS_URL: redis://redis:6379/0
      WAZUH_INDEXER_URL: http://wazuh-indexer:9200
      WAZUH_MANAGER_URL: https://wazuh-manager:55000
      WAZUH_API_USER: ${WAZUH_API_USER:-wazuh-wui}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-MyS3cr3tP4ssw0rd!}
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      DEBUG: ${DEBUG:-true}
      POLL_INTERVAL: ${POLL_INTERVAL:-30}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-sf_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-changeme-minio-pw}
      MINIO_BUCKET: ${MINIO_BUCKET:-sentinelforge-evidence}
      PLAYBOOK_DIR: /app/playbooks
    depends_on:
      - postgres
      - redis
      - wazuh-manager
      - wazuh-indexer
      - minio
    volumes:
      - ./backend:/app
      # Playbook dry-run + listing endpoints need read access to the same
      # YAML files the playbook-worker executes from.
      - ./playbooks:/app/playbooks:ro
    networks:
      - sentinelforge

  # ─── Cowrie SSH Honeypot (Module 5 — Ayush) ────────────────────
  cowrie:
    image: cowrie/cowrie:latest   # multi-arch: amd64 + arm64 (RPi)
    container_name: sf-cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"   # SSH honeypot port (attackers connect here)
      #- "22:2222"    # Uncomment to expose on default SSH port (requires host SSH moved to another port)
    volumes:
      - ./m5/cowrie/cowrie.cfg:/home/cowrie/cowrie/etc/cowrie.cfg:ro
      - ./m5/cowrie/userdb.txt:/home/cowrie/cowrie/etc/userdb.txt:ro
      - cowrie-logs:/home/cowrie/cowrie/var/log/cowrie
      - cowrie-data:/home/cowrie/cowrie/var/lib/cowrie
    networks:
      - sentinelforge

  # ─── Wazuh Agent — reads Cowrie logs, ships to manager ─────────
  wazuh-agent:
    build:
      context: ./m5/wazuh-agent
      dockerfile: Dockerfile
    container_name: sf-wazuh-agent
    restart: unless-stopped
    environment:
      WAZUH_MANAGER: wazuh-manager
      WAZUH_MANAGER_PORT: "1514"
    volumes:
      # Shared log volume — agent reads what Cowrie writes.
      # NOT :ro — Wazuh agent entrypoint touches a marker file here.
      - cowrie-logs:/var/log/cowrie
    depends_on:
      - cowrie
      - wazuh-manager
    networks:
      - sentinelforge

  # ─── Enrichment Worker (Module 2 — Kunal) ──────────────────────
  enrichment-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sf-enrichment-worker
    restart: unless-stopped
    command: python -m app.enrichment.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sf_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-sentinelforge}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      DEBUG: ${DEBUG:-false}
      # Threat intel API keys (set in .env)
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      # Evidence storage
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-sf_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-changeme-minio-pw}
      MINIO_BUCKET: ${MINIO_BUCKET:-sentinelforge-evidence}
      # Enrichment tuning
      ENRICHMENT_CACHE_TTL: ${ENRICHMENT_CACHE_TTL:-3600}
      ENRICHMENT_CONCURRENT_LIMIT: ${ENRICHMENT_CONCURRENT_LIMIT:-5}
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend:/app
    networks:
      - sentinelforge

  # ─── Playbook Worker (Module 3 — Tathagata) ────────────────────
  playbook-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sf-playbook-worker
    restart: unless-stopped
    command: python -m app.playbook.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sf_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-sentinelforge}
      REDIS_URL: redis://redis:6379/0
      WAZUH_MANAGER_URL: https://wazuh-manager:55000
      WAZUH_API_USER: ${WAZUH_API_USER:-wazuh-wui}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-MyS3cr3tP4ssw0rd!}
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      DEBUG: ${DEBUG:-false}
      # Cloudflare (for IP blocking)
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      # Playbook dir (mounted below)
      PLAYBOOK_DIR: /app/playbooks
    depends_on:
      - postgres
      - redis
      - backend
      - wazuh-manager
    volumes:
      - ./backend:/app
      - ./playbooks:/app/playbooks:ro
    networks:
      - sentinelforge

  # ─── MinIO — S3-compatible object storage for case evidence ────
  minio:
    image: minio/minio:latest
    container_name: sf-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"   # S3 API (9000 is taken by wazuh-indexer on host)
      - "9101:9001"   # MinIO web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sf_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio-pw}
    volumes:
      - minio-data:/data
    networks:
      - sentinelforge

volumes:
  wazuh-indexer-data:
  wazuh-api-config:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:
  wazuh-wodles:
  filebeat-etc:
  filebeat-var:
  postgres-data:
  redis-data:
  cowrie-logs:    # shared between cowrie + wazuh-agent
  cowrie-data:
  minio-data:

networks:
  sentinelforge:
    driver: bridge
